<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#7C3AED;#EC4899;#4F46E5" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#3B82F6;#9333EA;#2563EB" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="15" ry="15"/>
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Awesome Webhook Testing</text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">Curated list of Webhook Tools &amp; Local Tunnels</text>
  
  <circle cx="100" cy="100" r="4" fill="#fff">
    <animate attributeName="cy" values="100;120;100" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="80" r="6" fill="#fff">
    <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="3" fill="#fff">
    <animate attributeName="cx" values="150;170;150" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
